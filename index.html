<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>André | Portfólio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
        <div class="profile-section">
            <div class="avatar-container">
                <img src="/img/eu.png" alt="André" class="profile-img" onerror="this.style.display='none'">
            </div>
            <h1 class="profile-name">André<span>_</span></h1>
            <p class="profile-bio" data-i18n="hero.bio">
                Estudante de Ciência da Computação na <strong>UFRA</strong>.
                Entusiasta Microsoft e apaixonado por performance.
            </p>
        </div>

        <nav class="side-nav">
            <a href="index.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span data-i18n="nav.home">Home</span>
            </a>
            <a href="projects.html" class="nav-item">
                <i class="fas fa-code"></i>
                <span data-i18n="nav.projects">Projetos</span>
            </a>
            <a href="#contact" class="nav-item">
                <i class="fas fa-envelope"></i>
                <span data-i18n="nav.contact">Contato</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="lang-btn-alt" onclick="toggleLang()">
                <span id="lang-flag">🇧🇷</span>
                <span id="lang-label">PT</span>
            </button>
        </div>
    </aside>

    <!-- ── MAIN ── -->
    <main class="main-content">
        <div class="grid-container">

            <!-- Status -->
            <section class="card card-status">
                <span class="status-badge">
                    <span class="dot-green"></span>
                    <span data-i18n="status.open">Disponível</span>
                </span>
                <div class="status-info">
                    <div class="status-row">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Ananindeua, <strong>PA</strong></span>
                    </div>
                    <div class="status-row">
                        <i class="fas fa-briefcase"></i>
                        <span>TI — <strong>Enactus</strong></span>
                    </div>
                </div>
            </section>

            <!-- Terminal -->
            <section class="card card-terminal">
                <div class="term-bar">
                    <span class="tb tb-r"></span>
                    <span class="tb tb-y"></span>
                    <span class="tb tb-g"></span>
                    <span class="term-title">powershell.exe</span>
                </div>
                <div class="term-body" id="term-body">
                    <div class="term-curr" id="term-curr">
                        <span style="color:var(--blue)">C:\Users\Andre&gt;</span>
                        <span class="cursor"></span>
                    </div>
                </div>
            </section>

            <!-- Skills -->
            <section class="card card-skills">
                <p class="section-title" data-i18n="skills.title">// linguagens & ferramentas</p>
                <div class="skill-cloud" id="skill-cloud"></div>
            </section>

            <!-- Timeline -->
            <section class="card card-timeline">
                <p class="section-title" data-i18n="trajectory.title">// trajetória</p>
                <div class="timeline" id="timeline-list"></div>
            </section>

        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
